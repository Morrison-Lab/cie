# Build half of the PR preview: renders the site in the pull request's own
# context (which may be a fork) and uploads it, with the PR's metadata, as an
# artifact. The deploy half (preview-deploy.yml) publishes it to gh-pages.
# This job is read-only (contents: read): it must never write to the base repo.
#
# Keep this workflow's `name:` in sync with the `workflows:` list in
# preview-deploy.yml: that is how the deploy half finds this run.
#
# Do NOT name a `concurrency:` group `gh-pages` in this caller (deadlock,
# https://github.com/Morrison-Lab/gha/issues/809).
name: Quarto Preview Build

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, closed]

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
    uses: Morrison-Lab/gha/.github/workflows/preview.yml@v3
    with:
      render-profile: website
      # Web pages, slide decks and PDF handouts, as each chapter's front matter lists.
      formats: default
      # The math macros come from the latex-macros submodule.
      submodules: 'recursive'
      use-renv: false
      install-package: false
      r-packages: |
        any::knitr
        any::rmarkdown
        any::qte
        any::downlit
        any::xml2
      tinytex: true
      setup-chrome: false
      apt-packages: ''
      timeout-minutes: 60
