# Renders the site and deploys it to the gh-pages branch, keeping the
# pr-preview/ subtree.
#
# Do NOT name a `concurrency:` group `gh-pages` in this caller (deadlock,
# https://github.com/Morrison-Lab/gha/issues/809).
name: Quarto Publish

on:
  workflow_dispatch:
  push:
    branches: main

concurrency:
  group: quarto-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    permissions:
      contents: write
    uses: Morrison-Lab/gha/.github/workflows/quarto-publish.yml@v3
    with:
      render-profile: website
      # The math macros come from the latex-macros submodule.
      checkout-submodules: true
      setup-r: true
      use-renv: false
      r-packages: |
        any::knitr
        any::rmarkdown
        any::qte
        any::downlit
        any::xml2
      tinytex: true
      freeze-cache: true
      timeout-minutes: 60
